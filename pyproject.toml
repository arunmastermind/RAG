[project]
name = "rag-production-course"
version = "0.1.0"
description = "Production RAG & Agentic Systems Course Notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.0",
    "langchain-core>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.1.0",
    "langchain-anthropic>=0.4.0",
    "langchain-ollama>=1.0.0",
    "langchain-chroma>=1.1.0",
    "langgraph>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-text-splitters>=1.0.0",
    "chromadb>=1.5.0",
    "onnxruntime<1.20.0",
    "torch<2.3.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    "pypdf>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pillow>=11.0.0",
    "networkx>=3.3",
    "pyvis>=0.3.2",
    "pytest>=8.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jupyter>=1.0.0",
]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
